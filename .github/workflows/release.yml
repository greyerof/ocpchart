name: Upload release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload-release-assets:
    name: Upload release assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build ocpchart binary
        env:
          SHELL: /bin/bash
        run: |
          VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA::7}" make build
          tar -cvzf ocpchart-${GITHUB_REF_NAME}-linux-amd64.tar.gz ocpchart
          rm ocpchart

      - name: Upload ocpchart binary
        env:
          SHELL: /bin/bash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${GITHUB_REF_NAME} ocpchart-${GITHUB_REF_NAME}-linux-amd64.tar.gz
